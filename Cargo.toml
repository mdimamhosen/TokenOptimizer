[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/desktop",
    "crates/adapters",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AI Assist Team"]
license = "MIT"
repository = "https://github.com/ai-assist-dev/ai-assist"
description = "Universal analytics platform for AI coding assistants"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
tempfile = "3.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
walkdir = "2.4"
lazy_static = "1.4"
colored = "2.0"
tabled = "0.15"
indicatif = "0.17"
